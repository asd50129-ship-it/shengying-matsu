<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7d2020">
<title>鶯歌聖鶯宮｜線上請示媽祖</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--red:#7d2020;--gold:#b58f48;--cream:#f8f4ea;--ink:#3d2d26;--white:#fff}
*{box-sizing:border-box} body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--cream);color:var(--ink)}
.wrap{max-width:560px;margin:auto;min-height:100vh;padding:20px 18px 40px}
.card{background:rgba(255,255,255,.88);border:1px solid var(--gold);border-radius:22px;padding:22px;box-shadow:0 8px 28px #00000012}
.hero{text-align:center;padding:28px 10px 20px}.seal{width:84px;height:84px;margin:auto;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--red);font-size:28px;font-weight:800}
h1{color:var(--red);font-size:28px;margin:16px 0 6px} .sub{color:#8a7046;margin:0 0 18px}
label{display:block;font-weight:700;margin:14px 0 8px} textarea{width:100%;min-height:120px;border:1px solid #cdbb95;border-radius:14px;padding:13px;font-size:16px;background:#fffdf8}
button{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;margin-top:14px;cursor:pointer}
.primary{background:var(--red);color:#fff}.secondary{background:#efe5d1;color:var(--red)}
.note{font-size:13px;line-height:1.65;color:#6d6258;margin-top:16px}.result{text-align:center;margin-top:18px;padding:20px;border-radius:16px;background:#fff8ea;border:1px solid var(--gold);display:none}
.result b{font-size:30px;color:var(--red)} .cups{font-size:42px;letter-spacing:8px;margin:8px}
.history{margin-top:18px;font-size:14px;line-height:1.8}.tag{display:inline-block;border:1px solid #d9c8a3;border-radius:999px;padding:5px 10px;margin:4px;background:#fff}
footer{text-align:center;font-size:12px;color:#7c7268;margin-top:22px;line-height:1.7}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <div class="hero">
      <div class="seal">媽祖</div>
      <h1>鶯歌聖鶯宮</h1>
      <p class="sub">線上請示媽祖・虔心祈福</p>
    </div>

    <label for="q">請先靜心，默念姓名與請示事項</label>
    <textarea id="q" placeholder="可在此輸入請示事項（不會上傳或儲存）"></textarea>
    <button class="primary" id="ask">虔心擲筊</button>

    <div class="result" id="result">
      <div class="cups" id="cups">☯ ☯</div>
      <b id="rtype"></b>
      <p id="rdesc"></p>
    </div>

    <div class="history" id="history"></div>
    <button class="secondary" id="reset">重新請示</button>

    <p class="note">
      使用方式：請示前先靜心，將問題盡量以可明確回答的方式表達，再按下「虔心擲筊」。
      本程式的線上擲筊結果由裝置隨機產生，作為信仰互動與參考；重要事項建議親至聖鶯宮依正式儀式請示。
    </p>
  </section>
  <footer>鶯歌聖鶯宮（鶯歌媽）<br>第一版示範程式｜可再加入宮廟照片、求籤、活動公告與官方 QR Code</footer>
</main>
<script>
const outcomes=[
 {name:"聖筊",desc:"一正一反。傳統上多表示允准、肯定或可繼續依問題方向請示。",cups:"◐ ◑"},
 {name:"笑筊",desc:"兩面皆為正面。傳統上常理解為問題尚不明確、時機未定，或可重新整理問題後再請示。",cups:"◡ ◡"},
 {name:"陰筊",desc:"兩面皆為反面。傳統上多理解為否定，或目前不宜依該問題方向進行。",cups:"● ●"}
];
let history=[];
function secureRandom3(){
 const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%3;
}
document.getElementById("ask").onclick=()=>{
 const o=outcomes[secureRandom3()];
 history.push(o.name);
 document.getElementById("cups").textContent=o.cups;
 document.getElementById("rtype").textContent=o.name;
 document.getElementById("rdesc").textContent=o.desc;
 document.getElementById("result").style.display="block";
 document.getElementById("history").innerHTML="<strong>本次請示紀錄</strong><br>"+history.map((x,i)=>`<span class="tag">第 ${i+1} 筊｜${x}</span>`).join("");
};
document.getElementById("reset").onclick=()=>{
 history=[]; document.getElementById("q").value="";
 document.getElementById("result").style.display="none";
 document.getElementById("history").innerHTML="";
};
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
</script>
</body></html>
