<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#741b1b">
<title>鶯歌聖鶯宮｜線上請示媽祖</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--red:#741b1b;--red2:#9a2b26;--gold:#c49a4c;--cream:#fbf5e9;--ink:#443128;--white:#fff}
*{box-sizing:border-box}html{background:#efe5d1}body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:linear-gradient(#f5ead5,#fffaf0)}
main{max-width:560px;margin:auto;min-height:100vh;background:var(--cream);box-shadow:0 0 30px #0002}
.hero{position:relative;height:360px;overflow:hidden;background:#4b1515}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 46%;display:block}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,8,8,.08) 35%,rgba(75,18,18,.88) 100%)}
.heroText{position:absolute;z-index:2;left:20px;right:20px;bottom:24px;text-align:center;color:#fff;text-shadow:0 2px 8px #0008}
.heroText h1{margin:0;font-size:30px;letter-spacing:.12em}.heroText p{margin:7px 0 0;color:#f7ddb0;font-size:15px}
.content{padding:20px 18px 38px}
.card{background:#fffdf8;border:1px solid #d6b774;border-radius:20px;padding:20px;box-shadow:0 8px 24px #6f481410}
.guide{text-align:center;line-height:1.8;margin:0 0 14px}.guide b{color:var(--red)}
label{display:block;font-weight:800;margin:14px 0 8px;color:var(--red)}
textarea{width:100%;min-height:112px;border:1px solid #d5c19a;border-radius:14px;padding:13px;font:inherit;font-size:16px;background:#fff}
button{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;margin-top:13px}
.primary{background:linear-gradient(180deg,var(--red2),var(--red));color:#fff;box-shadow:0 6px 14px #741b1b33}
.secondary{background:#efe4cf;color:var(--red)}
.stage{display:none;margin-top:18px;text-align:center;border-top:1px solid #eadcc0;padding-top:18px}
.cups{height:115px;display:flex;justify-content:center;align-items:center;gap:20px;perspective:500px}
.cup{width:52px;height:96px;background:linear-gradient(90deg,#8d251f,#c34736);border:3px solid #651714;border-radius:55% 55% 45% 45% / 18% 18% 82% 82%;box-shadow:inset -8px 0 10px #5e171744,0 6px 9px #0002;transform-origin:center}
.cup.flat{background:linear-gradient(90deg,#6c1a18,#a52d27);box-shadow:inset 0 0 0 8px #d98d63,0 6px 9px #0002}
.throw .cup:first-child{animation:throwL .9s ease-in-out}.throw .cup:last-child{animation:throwR .9s ease-in-out}
@keyframes throwL{0%{transform:translateY(-80px) rotate(-100deg)}60%{transform:translateY(12px) rotate(28deg)}100%{transform:translateY(0) rotate(-8deg)}}
@keyframes throwR{0%{transform:translateY(-80px) rotate(110deg)}60%{transform:translateY(12px) rotate(-30deg)}100%{transform:translateY(0) rotate(8deg)}}
.resultName{font-size:30px;font-weight:900;color:var(--red);margin:5px 0}.desc{font-size:14px;line-height:1.7;color:#66594d}
.history{margin-top:15px}.tag{display:inline-block;padding:5px 9px;margin:3px;border:1px solid #d7c398;border-radius:999px;font-size:13px;background:#fff}
.notice{margin-top:18px;padding:13px;border-radius:12px;background:#f5ecdc;font-size:12px;line-height:1.7;color:#6e6257}
footer{text-align:center;font-size:12px;line-height:1.7;color:#806f5f;padding:18px}
</style>
</head>
<body>
<main>
<section class="hero">
<img src="matsu.jpeg" alt="鶯歌聖鶯宮媽祖">
<div class="heroText"><h1>鶯歌聖鶯宮</h1><p>鶯歌媽・慈悲護佑　福澤萬家</p></div>
</section>
<div class="content">
<section class="card">
<p class="guide">請先靜心，心中稟明<b>姓名、生辰及欲請示事項</b>，<br>問題盡量以可明確回答的方式表達。</p>
<label for="q">請示事項</label>
<textarea id="q" placeholder="可在此輸入請示事項；內容只留在您的裝置上"></textarea>
<button class="primary" id="ask">🙏 虔心請示・擲筊</button>

<div class="stage" id="stage">
  <div class="cups" id="cups"><div class="cup"></div><div class="cup flat"></div></div>
  <div class="resultName" id="rtype">請稍候</div>
  <div class="desc" id="rdesc">虔心擲筊中……</div>
  <div class="history" id="history"></div>
</div>

<button class="secondary" id="reset">重新請示</button>
<div class="notice">線上擲筊結果由裝置隨機產生，作為信仰互動與參考。重要事項建議親至鶯歌聖鶯宮，依宮內正式儀式請示。正式公開前，擲筊規則與文字說明可再依本宮方式調整。</div>
</section>
</div>
<footer>鶯歌聖鶯宮（鶯歌媽）<br>線上請示媽祖・第二版</footer>
</main>
<script>
const outcomes=[
 {name:"聖筊",desc:"一正一反。傳統上多表示允准、肯定，或可依目前問題方向繼續請示。",cls:["","flat"]},
 {name:"笑筊",desc:"兩面皆為正面。傳統上常理解為問題尚不明確、時機未定，可整理問題後再請示。",cls:["",""]},
 {name:"陰筊",desc:"兩面皆為反面。傳統上多理解為否定，或目前不宜依該問題方向進行。",cls:["flat","flat"]}
];
let history=[];
function rnd(){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%3}
const ask=document.getElementById("ask"), stage=document.getElementById("stage"), cups=document.getElementById("cups");
ask.onclick=()=>{
 stage.style.display="block"; cups.classList.remove("throw"); void cups.offsetWidth; cups.classList.add("throw");
 document.getElementById("rtype").textContent="請稍候";
 document.getElementById("rdesc").textContent="虔心擲筊中……";
 setTimeout(()=>{
  const o=outcomes[rnd()], cs=cups.children;
  cs[0].className="cup "+o.cls[0]; cs[1].className="cup "+o.cls[1];
  history.push(o.name);
  document.getElementById("rtype").textContent=o.name;
  document.getElementById("rdesc").textContent=o.desc;
  document.getElementById("history").innerHTML="<b>本次請示紀錄</b><br>"+history.map((x,i)=>`<span class="tag">第 ${i+1} 筊｜${x}</span>`).join("");
 },950);
};
document.getElementById("reset").onclick=()=>{history=[];document.getElementById("q").value="";stage.style.display="none";document.getElementById("history").innerHTML=""};
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
</script>
</body></html>
